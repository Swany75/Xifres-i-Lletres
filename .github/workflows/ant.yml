
# .github/workflows/java-ant-ci.yml
name: Java CI (Ant)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
          ant -version

      # Si tu build.xml no está en la raíz, ajusta BUILD_FILE_PATH
      - name: Build with Ant
        env:
          BUILD_FILE_PATH: build.xml
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ant -noinput -buildfile "$BUILD_FILE_PATH"
